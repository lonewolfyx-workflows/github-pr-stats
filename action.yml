name: GitHub PR Stats

description: >
  Generate pull request statistics for repositories contributed to
  but not owned by a GitHub user, and render them as an SVG table.

inputs:
  username:
    description: GitHub username
    required: true

  token:
    description: GitHub token
    required: false
    default: ${{ github.token }}

  output:
    description: SVG output file path
    required: false
    default: github-pr-stats.svg

  max-rows:
    description: Maximum number of repositories
    required: false
    default: '0'

outputs:
  data:
    description: External repository PR statistics as JSON
    value: ${{ steps.generate.outputs.data }}

  svg-path:
    description: Generated SVG file path
    value: ${{ steps.generate.outputs.svg-path }}

  repository-count:
    description: Number of repositories
    value: ${{ steps.generate.outputs.repository-count }}

  pr-count:
    description: Total number of pull requests
    value: ${{ steps.generate.outputs.pr-count }}

runs:
  using: composite

  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.9.0

    - name: Set Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    - name: Generate GitHub PR Stats
      id: generate
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_MAX-ROWS: ${{ inputs.max-rows }}
      run: pnpm exec tsx ./src/index.ts

branding:
  icon: git-pull-request
  color: blue
